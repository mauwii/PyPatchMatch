name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # one group per commit on main: a group keeps only one pending run
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # the newest uv with a checksum in this pin, so uv moves with Dependabot
          version: latest-known
          prune-cache: true
      # the hook environments, pinned to commit SHAs in the config
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', '.python-version') }}
      - run: uv run --locked --no-build --only-group dev pre-commit run --all-files --show-diff-on-failure

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # only here, so that builds from the sdist survive new compiler warnings
      SKBUILD_CMAKE_DEFINE: CMAKE_COMPILE_WARNING_AS_ERROR=ON
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # oldest and newest supported Python, and the next one; the ctypes library is
        # version independent
        python-version: ["3.11", "3.14", "3.15"]
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # setuptools-scm derives the version from the git tags

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: latest-known
          prune-cache: true
          python-version: ${{ matrix.python-version }}

      # actions/cache rejects ".." in paths, and the job env has no runner context
      - &opencv-root
        name: Set OpenCV_ROOT
        shell: bash
        run: echo "OpenCV_ROOT=$RUNNER_TEMP/opencv" >> "$GITHUB_ENV"

      - &opencv-cache
        name: Cache OpenCV
        id: cache-opencv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.OpenCV_ROOT }}
          key: opencv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build_opencv.py') }}

      # the project needs OpenCV to build, so only the locked test group
      - &opencv-build
        name: Build OpenCV
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        run: uv run --locked --no-build --only-group test python scripts/build_opencv.py

      # only the test group: dev tools such as pre-commit lag behind with wheels for new Pythons
      - run: uv run --locked --no-build --no-default-groups --group test pytest

  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SKBUILD_CMAKE_DEFINE: PATCHMATCH_SANITIZE=ON
    steps:
      - *checkout
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: latest-known
          prune-cache: true
      - *opencv-root
      - *opencv-cache
      - *opencv-build

      # Python is not instrumented. ASan needs libstdc++ loaded to intercept exceptions,
      # and --capture=sys lets its report of an abort reach the log.
      - name: Test with sanitizers
        run: >-
          uv run --locked --no-build
          env LD_PRELOAD="$(gcc -print-file-name=libasan.so) $(gcc -print-file-name=libstdc++.so)"
          pytest --no-cov --capture=sys
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SKBUILD_CMAKE_DEFINE: PATCHMATCH_COVERAGE=ON;CMAKE_EXPORT_COMPILE_COMMANDS=ON
      # a fixed path for sonar.cfamily.compile-commands
      SKBUILD_BUILD_DIR: build
      # fork and Dependabot PRs get no secrets
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - *checkout
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: latest-known
          prune-cache: true
      - *opencv-root
      - *opencv-cache
      - *opencv-build
      - run: uv run --locked --no-build --group coverage pytest --cov-report=xml

      # the distance loop runs more than 2**32 times, which gcovr takes for a gcov bug
      - name: Check the C++ coverage
        run: >-
          uv run --locked --no-build --group coverage
          gcovr --filter patchmatch/csrc/ --exclude-throw-branches --exclude-unreachable-branches
          --gcov-suspicious-hits-threshold 0 --print-summary --sonarqube coverage-cpp.xml
          --fail-under-line 95 --fail-under-branch 90

      - name: SonarCloud scan
        if: env.HAS_SONAR_TOKEN == 'true'
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  lowest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - *checkout
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: latest-known
          prune-cache: true
          python-version: "3.11"
      - *opencv-root
      - *opencv-cache
      - *opencv-build
      # the lower bounds of the dependencies in pyproject.toml
      - run: uv run --locked --no-build --with numpy==1.23.2 --with pillow==9.2.0 pytest

  # Homebrew and newer distributions ship OpenCV 5, which builds from the sdist link
  opencv5:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PATCHMATCH_OPENCV_VERSION: 5.0.0
      SKBUILD_CMAKE_DEFINE: CMAKE_COMPILE_WARNING_AS_ERROR=ON
    steps:
      - *checkout
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: latest-known
          prune-cache: true
      - *opencv-root
      - name: Cache OpenCV
        id: cache-opencv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.OpenCV_ROOT }}
          key: opencv-${{ env.PATCHMATCH_OPENCV_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build_opencv.py') }}
      - *opencv-build
      - run: uv run --locked --no-build pytest --no-cov

  # builds from the sdist link the OpenCV of the distribution, not the pinned one
  system-opencv:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - *checkout
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: latest-known
          prune-cache: true
      # the mirror is sometimes very slow, so the downloads are cached; apt checks them
      # against the signed index and dpkg installs them as usual
      - name: List the packages of the distribution's OpenCV
        id: apt
        run: |
          sudo apt-get update
          apt-get install --print-uris -qq --no-install-recommends libopencv-dev > "$RUNNER_TEMP/apt-uris"
          echo "digest=$(sha256sum < "$RUNNER_TEMP/apt-uris" | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Cache the downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-opencv-${{ steps.apt.outputs.digest }}
          restore-keys: apt-opencv-
      - name: Install the OpenCV of the distribution
        run: |
          archives="$RUNNER_TEMP/apt-archives"
          mkdir -p "$archives"
          find "$archives" -name '*.deb' -exec sudo cp -t /var/cache/apt/archives/ {} +
          sudo apt-get install --download-only --yes --no-install-recommends libopencv-dev
          # only the files of the current list, so that the cache does not grow
          find "$archives" -name '*.deb' -delete
          awk '{print $2}' "$RUNNER_TEMP/apt-uris" | sed 's|^|/var/cache/apt/archives/|' | xargs cp -t "$archives"/
          sudo apt-get install --yes --no-install-recommends libopencv-dev
      - run: uv run --locked --no-build pytest --no-cov

  # Single required status check for branch protection, independent of the matrix.
  ci-ok:
    if: always()
    needs: [lint, test, sanitizers, coverage, lowest, opencv5, system-opencv]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
