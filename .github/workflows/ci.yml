name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # --locked fails on an outdated uv.lock and --no-build on a dependency without a
      # wheel (SonarCloud S8544, S8541); uv still builds the project itself.
      - run: uv run --locked --no-build --only-group dev pre-commit run --all-files --show-diff-on-failure

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    env:
      # Compiler warnings (flags in CMakeLists.txt) fail the build only here: builds
      # from the sdist must not break when a newer compiler adds a warning.
      SKBUILD_CMAKE_DEFINE: CMAKE_COMPILE_WARNING_AS_ERROR=ON
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # oldest and newest supported Python; the ctypes library is version independent
        python-version: ["3.10", "3.14"]
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # setuptools-scm derives the version from the git tags

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}

      # Outside the checkout, but without "..": actions/cache rejects such paths
      # and never saved the build. The runner context is not available in the
      # job env, so the variable is set here.
      - &opencv-root
        name: Set OpenCV_ROOT
        shell: bash
        run: echo "OpenCV_ROOT=$RUNNER_TEMP/opencv" >> "$GITHUB_ENV"

      - &opencv-cache
        name: Cache OpenCV
        id: cache-opencv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.OpenCV_ROOT }}
          key: opencv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build_opencv.py') }}

      # The project can only be built once OpenCV is installed, so this step runs in the
      # locked dev group without it, which the next step installs anyway. --no-project
      # would lock nothing (SonarCloud S8544).
      - &opencv-build
        name: Build OpenCV
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        run: uv run --locked --no-build --only-group dev python scripts/build_opencv.py

      - run: uv run --locked --no-build pytest

  # AddressSanitizer and UndefinedBehaviorSanitizer on the native code: an out-of-bounds
  # read can still pass the checks of the tests, and through ctypes a crash takes down
  # the whole process.
  sanitizers:
    runs-on: ubuntu-latest
    env:
      SKBUILD_CMAKE_DEFINE: PATCHMATCH_SANITIZE=ON
    steps:
      - *checkout
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - *opencv-root
      - *opencv-cache
      - *opencv-build

      # Python is not instrumented, so the ASan runtime is preloaded, for pytest only,
      # not for uv and the build. Its leak check would report the interpreter's own
      # allocations. With --capture=sys the report of an abort reaches the log; pytest's
      # default capture of the file descriptors keeps it.
      - name: Test with sanitizers
        run: >-
          uv run --locked --no-build
          env LD_PRELOAD="$(gcc -print-file-name=libasan.so)"
          pytest --no-cov --capture=sys
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1

  # Single required status check for branch protection, independent of the matrix.
  ci-ok:
    if: always()
    needs: [lint, test, sanitizers]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
