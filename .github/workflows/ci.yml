name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv run --locked --no-build --only-group dev pre-commit run --all-files --show-diff-on-failure

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    env:
      # only here, so that builds from the sdist survive new compiler warnings
      SKBUILD_CMAKE_DEFINE: CMAKE_COMPILE_WARNING_AS_ERROR=ON
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # oldest and newest supported Python; the ctypes library is version independent
        python-version: ["3.10", "3.14"]
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # setuptools-scm derives the version from the git tags

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}

      # actions/cache rejects ".." in paths, and the job env has no runner context
      - &opencv-root
        name: Set OpenCV_ROOT
        shell: bash
        run: echo "OpenCV_ROOT=$RUNNER_TEMP/opencv" >> "$GITHUB_ENV"

      - &opencv-cache
        name: Cache OpenCV
        id: cache-opencv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.OpenCV_ROOT }}
          key: opencv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build_opencv.py') }}

      # the project needs OpenCV to build, so only the locked dev group
      - &opencv-build
        name: Build OpenCV
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        run: uv run --locked --no-build --only-group dev python scripts/build_opencv.py

      - run: uv run --locked --no-build pytest

  sanitizers:
    runs-on: ubuntu-latest
    env:
      SKBUILD_CMAKE_DEFINE: PATCHMATCH_SANITIZE=ON
    steps:
      - *checkout
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - *opencv-root
      - *opencv-cache
      - *opencv-build

      # Python is not instrumented. ASan needs libstdc++ loaded to intercept exceptions,
      # and --capture=sys lets its report of an abort reach the log.
      - name: Test with sanitizers
        run: >-
          uv run --locked --no-build
          env LD_PRELOAD="$(gcc -print-file-name=libasan.so) $(gcc -print-file-name=libstdc++.so)"
          pytest --no-cov --capture=sys
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1

  coverage:
    runs-on: ubuntu-latest
    env:
      SKBUILD_CMAKE_DEFINE: PATCHMATCH_COVERAGE=ON
    steps:
      - *checkout
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - *opencv-root
      - *opencv-cache
      - *opencv-build
      - run: uv run --locked --no-build --group coverage pytest --no-cov

      # the distance loop runs more than 2**32 times, which gcovr takes for a gcov bug
      - name: Check the C++ coverage
        run: >-
          uv run --locked --no-build --group coverage
          gcovr --filter patchmatch/csrc/ --exclude-throw-branches --exclude-unreachable-branches
          --gcov-suspicious-hits-threshold 0 --print-summary
          --fail-under-line 95 --fail-under-branch 90

  # Single required status check for branch protection, independent of the matrix.
  ci-ok:
    if: always()
    needs: [lint, test, sanitizers, coverage]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
