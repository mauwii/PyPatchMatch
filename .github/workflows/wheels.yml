name: Wheels

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # setuptools-scm derives the version from the git tags
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv build --sdist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz

  # The wheels are built from the sdist, which already carries the version, so no
  # git metadata is needed on the runners or inside the manylinux containers.
  wheels:
    name: wheel (${{ matrix.os }})
    needs: sdist
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - macos-15-intel
          - windows-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdist
          path: dist/
      - name: Locate sdist
        id: sdist
        shell: bash
        run: |
          sdist=$(ls dist/*.tar.gz)
          echo "path=$sdist" >> "$GITHUB_OUTPUT"
          # there is no checkout, the cache key hashes these files of the sdist
          name=$(basename "$sdist" .tar.gz)
          tar -xzf "$sdist" -C dist "$name/scripts/build_opencv.py" "$name/pyproject.toml"
      - name: Restore OpenCV
        id: opencv
        # wheels of a tag (releases, manual runs on a tag) are always built from scratch
        if: github.event_name != 'release' && !startsWith(github.ref, 'refs/tags/')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.os == 'Windows' && 'C:/opencv' || '/tmp/opencv' }}
          key: opencv-wheel-${{ matrix.os }}-${{ hashFiles('dist/*/scripts/build_opencv.py', 'dist/*/pyproject.toml') }}
      - uses: pypa/cibuildwheel@e090b81e30c4d855ea63bf4b6e59204c09a101ae # v4.2.1
        with:
          package-dir: ${{ steps.sdist.outputs.path }}
        env:
          # lets the cache steps reach the OpenCV built inside the manylinux container
          CIBW_CONTAINER_ENGINE: "docker; create_args: --volume /tmp/opencv:/tmp/opencv"
      - name: Save OpenCV
        if: steps.opencv.outcome == 'success' && steps.opencv.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.os == 'Windows' && 'C:/opencv' || '/tmp/opencv' }}
          key: ${{ steps.opencv.outputs.cache-primary-key }}
      - name: Check the OpenCV SBOM and that no zlib code is linked
        shell: bash
        run: |
          # macOS runners have only python3, Windows only python
          python=$(command -v python3 || command -v python)
          "$python" -m zipfile -l wheelhouse/*.whl | tee contents.txt
          grep -q "\.dist-info/sboms/opencv\.cdx\.json" contents.txt
          # the SBOM leaves out OpenCV's zlib, which only FileStorage uses
          if [ "$RUNNER_OS" != Windows ]; then
            "$python" -m zipfile -e wheelhouse/*.whl wheel
            zlib=" _?(adler32|crc32|deflate|inflate|gz[a-z]+)"
            if nm wheel/patchmatch/libpatchmatch.* | grep -E "$zlib"; then exit 1; fi
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.os }}
          path: wheelhouse/*.whl

  # Without a matching wheel, pip builds the sdist. If that fails, the override in
  # pyproject.toml builds a wheel without the native library instead of blocking the
  # installation. This job keeps that working; test_import_without_native_library
  # covers the import of such a wheel. It uploads nothing, so the pure wheel never
  # reaches the publish job.
  sdist-fallback:
    needs: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdist
          path: dist/
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: Build a wheel from the sdist without OpenCV
        run: >-
          uv build --wheel dist/*.tar.gz --out-dir fallback
          -C cmake.define.CMAKE_DISABLE_FIND_PACKAGE_OpenCV=ON
      - name: Check that it is a pure wheel with the package but without the library
        run: |
          wheel=$(ls fallback/*-py3-none-any.whl)
          unzip -l "$wheel" | tee contents.txt
          grep -q "patchmatch/patch_match.py" contents.txt
          if grep -q "libpatchmatch" contents.txt; then exit 1; fi

  # Single required status check for branch protection, independent of the matrix.
  wheels-ok:
    if: always()
    needs: [sdist, wheels, sdist-fallback]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}

  publish:
    needs: [wheels, sdist, sdist-fallback]
    if: github.event_name == 'release' && github.repository == 'mauwii/PyPatchMatch'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/PyPatchMatch
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist/
          merge-multiple: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
