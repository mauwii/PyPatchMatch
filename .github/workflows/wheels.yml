name: Wheels

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # setuptools-scm derives the version from the git tags
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  # The wheels are built from the sdist, which already carries the version, so no
  # git metadata is needed on the runners or inside the manylinux containers.
  wheels:
    name: wheel (${{ matrix.os }})
    needs: sdist
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - macos-15-intel
          - windows-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist/
      - name: Locate sdist
        id: sdist
        shell: bash
        run: echo "path=$(ls dist/*.tar.gz)" >> "$GITHUB_OUTPUT"
      - uses: pypa/cibuildwheel@v4.2.1
        with:
          package-dir: ${{ steps.sdist.outputs.path }}
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}
          path: wheelhouse/*.whl

  publish:
    needs: [wheels, sdist]
    if: github.event_name == 'release' && github.repository == 'mauwii/PyPatchMatch'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/PyPatchMatch
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
