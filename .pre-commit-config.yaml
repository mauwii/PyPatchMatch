# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
  # ruff and mypy from uv.lock, the versions of the editor; like the lint job, without
  # building the library, which needs OpenCV
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --locked --no-build --only-group dev ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --locked --no-build --only-group dev ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: mypy
        name: mypy
        entry: uv run --locked --no-build --only-group dev mypy
        language: system
        types: [python]
        pass_filenames: false
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: d1df990f871e616da38bb602a2671d5e840b9989  # frozen: 0.13.7
    hooks:
      - id: uv-lock
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: ce4bd7270237e95464b37d808b942f02785192c4  # frozen: v23.1.5
    hooks:
      - id: clang-format
        types_or: [c, c++]
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95  # frozen: v0.11.0.1
    hooks:
      - id: shellcheck
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: 341e2a331ba578029e66c2e01183e7a6b5ca9ab4  # frozen: v0.24.0
    hooks:
      - id: markdownlint-cli2
  - repo: https://github.com/crate-ci/typos
    # a tag: Dependabot matched the frozen comment against the tags of its other crates
    rev: v1.52.0
    hooks:
      - id: typos
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 06a39750ec31860bb44f2acf67182c40016cd1e7  # frozen: v1.32.0
    hooks:
      - id: zizmor
