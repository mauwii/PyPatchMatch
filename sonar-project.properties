sonar.projectKey=mauwii_PyPatchMatch
sonar.organization=mauwii

sonar.sources=patchmatch,scripts
sonar.tests=tests
sonar.python.version=3.11

# written by the CI job coverage
sonar.python.coverage.reportPaths=coverage.xml
sonar.coverageReportPaths=coverage-cpp.xml
sonar.cfamily.compile-commands=build/compile_commands.json
# developer tools without tests, analyzed for issues only
sonar.coverage.exclusions=scripts/**
# fail the coverage job, and with it ci-ok, on a red quality gate
sonar.qualitygate.wait=true
