[build-system]
build-backend = "scikit_build_core.build"
requires = ["scikit-build-core>=0.11"]

[project]
name = "PyPatchMatch"
description = "This library implements the PatchMatch based inpainting algorithm."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "The InvokeAI Project", email = "lincoln.stein@gmail.com" },
    { name = "Kyle Schouviller", email = "kyle0654@hotmail.com" },
    { name = "Matthias Wild", email = "mauwii@outlook.de" },
    { name = "Younesse ANDAM", email = "younesse.andam@gmail.com" },
]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = ["numpy", "pillow"]
dynamic = ["version"]

[project.urls]
"Source Code" = "https://github.com/mauwii/PyPatchMatch"

[dependency-groups]
dev = [{ include-group = "test" }, "pre-commit", "ruff"]
test = ["pytest", "pytest-cov"]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
# The library is loaded via ctypes and does not use the CPython ABI,
# so one wheel per platform serves every Python version.
wheel.py-api = "py3"
wheel.packages = ["patchmatch"]
wheel.exclude = ["patchmatch/csrc/**"]
sdist.exclude = [".*", "examples", "tests", "uv.lock"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "patchmatch/__init__.py"

[tool.cibuildwheel]
# The wheels are Python-version independent (py3-none-<platform>), so each platform
# is built and tested once; the CI workflow covers the other Python versions.
build = "cp310-*"
skip = "*-musllinux_*"
# OpenCV is built once per job in before-all, only for the runner's native arch
archs = ["native"]
test-groups = ["test"]
test-command = "pytest {project}/tests --no-cov"
before-all = "python {project}/scripts/build_opencv.py"
environment = { OpenCV_ROOT = "/tmp/opencv" }

[tool.cibuildwheel.linux]
before-all = "/opt/python/cp312-cp312/bin/python {project}/scripts/build_opencv.py"

[tool.cibuildwheel.macos]
environment = { OpenCV_ROOT = "/tmp/opencv", MACOSX_DEPLOYMENT_TARGET = "11.0" }

[tool.cibuildwheel.windows]
environment = { OpenCV_ROOT = "C:/opencv" }

[tool.uv]
# Rebuild the native library whenever its sources change.
cache-keys = [
    { file = "CMakeLists.txt" },
    { file = "patchmatch/csrc/*" },
    { file = "pyproject.toml" },
]

[tool.ruff]
extend-exclude = ["patchmatch/csrc"]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "RUF", "SIM", "UP", "W"]
ignore = ["E501"]  # line length is enforced by ruff-format

[tool.coverage.report]
fail_under = 75

[tool.pytest.ini_options]
addopts = ["--cov-branch", "--cov-report=term:skip-covered", "--cov=patchmatch"]
minversion = "6.0"
python_files = ["test_*.py"]
testpaths = ["tests"]
